svg.dia .fuse { fill: #dcecf2; stroke: #0b6b88; stroke-width: 1.4; stroke-dasharray: 6 4; }
svg.dia .badge { fill: #ffffff; stroke: #0b6b88; stroke-width: 1.4; }
svg.dia .ring-acc { fill: none; stroke: #0b6b88; stroke-width: 2; }
svg.dia .dot-hollow { fill: #ffffff; stroke: #15202b; stroke-width: 1.4; }
svg.dia a.map-node { cursor: pointer; }
svg.dia a.map-node:hover .node, svg.dia a.map-node:focus .node { fill: #dcecf2; }</style><rect width="880" height="404" fill="#ffffff"/><title id="fig-map-title">Six-section learning map</title><desc id="fig-map-desc">Section 1 (representation) feeds the four transformation sections 2 to 5; sections 2, 3 and 4 feed section 6 (efficient processing). Lettered arrows are explained in the list below the map.</desc><defs><marker id="fig-map-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="fig-map-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="fig-map-ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warm"/></marker></defs><path d="M330.0,92.0 C330.0,125.0 113.0,125.0 113.0,156.0" class="acc" marker-end="url(#fig-map-ah-acc)"/><circle cx="221.5" cy="125.0" r="10.0" class="badge"/><text x="221.5" y="129.0" class="t-badge" text-anchor="middle">a</text><path d="M440.0,92.0 C440.0,125.0 549.0,125.0 549.0,156.0" class="acc" marker-end="url(#fig-map-ah-acc)"/><circle cx="494.5" cy="125.0" r="10.0" class="badge"/><text x="494.5" y="129.0" class="t-badge" text-anchor="middle">b</text><path d="M550.0,92.0 C550.0,125.0 767.0,125.0 767.0,156.0" class="acc" marker-end="url(#fig-map-ah-acc)"/><circle cx="658.5" cy="125.0" r="10.0" class="badge"/><text x="658.5" y="129.0" class="t-badge" text-anchor="middle">c</text><path d="M113.0,250.0 C113.0,281.0 330.0,281.0 330.0,310.0" class="acc" marker-end="url(#fig-map-ah-acc)"/><circle cx="221.5" cy="281.0" r="10.0" class="badge"/><text x="221.5" y="285.0" class="t-badge" text-anchor="middle">e</text><path d="M331.0,250.0 C331.0,281.0 440.0,281.0 440.0,310.0" class="acc" marker-end="url(#fig-map-ah-acc)"/><ci