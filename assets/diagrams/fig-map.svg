<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="404" class="dia" id="fig-map" viewBox="0 0 880 404" role="img" aria-labelledby="fig-map-title fig-map-desc" xmlns="http://www.w3.org/2000/svg"><style>svg.dia { display: block; width: 100%; height: auto; font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
svg.dia text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
svg.dia .t { fill: #15202b; font-size: 13px; }
svg.dia .t-s { fill: #56636f; font-size: 11.5px; }
svg.dia .t-b { fill: #15202b; font-size: 13.5px; font-weight: 600; }
svg.dia .t-m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.dia .t-acc { fill: #0b6b88; }
svg.dia .t-warm { fill: #9c5700; }
svg.dia .t-inv { fill: #ffffff; }
svg.dia .t-num { fill: #ffffff; font-size: 13px; font-weight: 700; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.dia .t-badge { fill: #0b6b88; font-size: 11.5px; font-weight: 700; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.dia .t-sup { font-size: 10px; }
svg.dia .ln { stroke: #15202b; stroke-width: 1.4; fill: none; }
svg.dia .ln-mute { stroke: #56636f; stroke-width: 1; fill: none; }
