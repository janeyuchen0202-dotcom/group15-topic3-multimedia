svg.dia a.map-node:hover .node, svg.dia a.map-node:focus .node { fill: #dcecf2; }</style><rect width="880" height="336" fill="#ffffff"/><title id="fig-s1-title">Sampling and quantization of one signal</title><desc id="fig-s1-desc">Left: a continuous signal is measured at regular time steps Ts and each measurement is rounded to one of eight 3-bit levels; the difference is the quantization error, at most half a step. Right: grey ramps with 2, 4, 8 and 256 levels show how bit depth controls the number of available values.</desc><defs><marker id="fig-s1-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="fig-s1-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="fig-s1-ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warm"/></marker></defs><text x="66.0" y="24.0" class="t-b" text-anchor="start">A · Sampling (when) and quantization (how precisely), 3 bits = 8 levels</text><line x1="74.0" y1="252.2" x2="560.0" y2="252.2" class="grid dash"/><text x="66.0" y="256.2" class="t-s t-m" text-anchor="end">000</text><line x1="74.0" y1="224.8" x2="560.0" y2="224.8" class="grid dash"/><text x="66.0" y="228.8" class="t-s t-m" text-anchor="end">001</text><line x1="74.0" y1="197.2" x2="560.0" y2="197.2" class="grid dash"/><text x="66.0" y="201.2" class="t-s t-m" text-anchor="end">010</text><line x1="74.0" y1="169.8" x2="560.0" y2="169.8" class="grid dash"/><text x="66.0" y="173.8" class="t-s t-m" text-anchor="end">011</text><line x1="74.0" y1="142.2" x2="560.0" y2="142.2" class="grid dash"/><text x="66.0" y="146.2" class="t-s t-m" text-anchor="end">100</text><line x1="74.0" y1="114.8" x2="560.0" y2="114.8" class="grid dash"/><text x="66.0" y="118.8" class="t-