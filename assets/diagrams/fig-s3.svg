57.8" x2="511.2" y2="97.2" class="acc-thin"/><line x1="491.0" y1="71.8" x2="530.5" y2="90.2" class="acc-thin"/><polygon points="503.3,45.5 542.7,63.9 524.3,103.4 484.9,85.0" class="acc"/><circle cx="503.3" cy="45.5" r="4.0" class="f-warm"/><text x="512.0" y="160.0" class="t-b" text-anchor="middle">Similarity</text><text x="512.0" y="178.0" class="t-s t-m" text-anchor="middle">DOF 4</text><text x="512.0" y="196.0" class="t-s" text-anchor="middle">keeps angles</text><rect x="588.0" y="14.0" width="136.0" height="196.0" rx="6" class="panel"/><polygon points="614.0,34.0 678.0,34.0 678.0,98.0 614.0,98.0" class="ln-mute dash"/><polygon points="617.2,43.0 678.0,54.5 704.9,104.4 644.1,92.9" class="f-soft"/><line x1="637.5" y1="46.8" x2="664.3" y2="96.7" class="acc-thin"/><line x1="626.2" y1="59.6" x2="687.0" y2="71.1" class="acc-thin"/><line x1="657.7" y1="50.6" x2="684.6" y2="100.6" class="acc-thin"/><line x1="635.1" y1="76.2" x2="695.9" y2="87.8" class="acc-thin"/><polygon points="617.2,43.0 678.0,54.5 704.9,104.4 644.1,92.9" class="acc"/><circle cx="617.2" cy="43.0" r="4.0" class="f-warm"/><text x="656.0" y="160.0" class="t-b" text-anchor="middle">Affine</text><text x="656.0" y="178.0" class="t-s t-m" text-anchor="middle">DOF 6</text><text x="656.0" y="196.0" class="t-s" text-anchor="middle">keeps parallel lines</text><rect x="732.0" y="14.0" width="136.0" height="196.0" rx="6" class="panel"/><polygon points="758.0,34.0 822.0,34.0 822.0,98.0 758.0,98.0" class="ln-mute dash"/><polygon points="781.0,41.7 820.7,41.7 833.5,103.1 761.8,103.1" class="f-soft"/><line x1="794.3" y1="41.7" x2="785.7" y2="103.1" class="acc-thin"/><line x1="776.9" y1="55.0" x2="823.5" y2="55.0" class="acc-thin"/><line x1="807.5" y1="41.7" x2="809.6" y2="103.1" class="acc-thin"/><line x1="771.0" y1="74.0" x2="827.4" y2="74.0" class="acc-thin"/><polygon points="781.0,41.7 820.7,41.7 833.5,103.1 761.8,103.1" class="acc"/><circle cx="781.0" cy="41.7" r="4.0" class="f-warm"/><text x="800.0" y="160.0" class="t-b" text-anchor="middle">Projective</text><text x="800.0" y="178.0" class="t-s t-m" text-anchor="middle">DOF 8</text><text x="800.0" y="196.0" class="t-s" text-anchor="middle">keeps straight lines</text><text x="12.0" y="242.0" class="t-b" text-anchor="start">Inverse mapping: fill every output pixel by looking back into the source</text><rect x="30.0" y="316.0" width="248.0" height="180.0" rx="6" class="panel"/><circle cx="52.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="52.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="52.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="52.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="52.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="86.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="86.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="86.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="86.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="86.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="120.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="120.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="120.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="120.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="120.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="154.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="154.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="154.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="154.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="154.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="188.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="188.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="188.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="188.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="188.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="222.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="222.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="222.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="222.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="222.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="256.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="256.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="256.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="256.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="256.0" cy="474.0" r="2.2" class="f-mute"/><text x="30.0" y="518.0" class="t-s" text-anchor="start"></text><rect x="564.0" y="316.0" width="248.0" height="180.0" rx="6" class="panel"/><circle cx="586.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="586.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="586.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="586.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="586.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="620.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="620.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="620.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="620.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="620.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="654.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="654.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="654.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="654.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="654.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="688.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="688.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="688.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="688.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="688.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="722.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="722.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="722.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="722.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="722.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="756.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="756.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="756.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="756.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="756.0" cy="474.0" r="2.2" class="f-mute"/><circle cx="790.0" cy="338.0" r="2.2" class="f-mute"/><circle cx="790.0" cy="372.0" r="2.2" class="f-mute"/><circle cx="790.0" cy="406.0" r="2.2" class="f-mute"/><circle cx="790.0" cy="440.0" r="2.2" class="f-mute"/><circle cx="790.0" cy="474.0" r="2.2" class="f-mute"/><text x="564.0" y="518.0" class="t-s" text-anchor="start"></text><text x="30.0" y="308.0" class="t" text-anchor="start">source image f(x, y)</text><text x="564.0" y="308.0" class="t" text-anchor="start">output image g(x′, y′)</text><polygon points="53.0,378.6 211.4,327.1 248.2,440.2 89.8,491.7" class="acc dash"/><line x1="30.0" y1="534.0" x2="54.0" y2="534.0" class="acc dash"/><text x="60.0" y="538.0" class="t-s t-acc" text-anchor="start">the output frame, mapped back into the source</text><circle cx="756.0" cy="440.0" r="9.0" class="ring-acc"/><circle cx="756.0" cy="440.0" r="4.0" class="f-acc"/><rect x="180.0" y="398.0" width="50.0" height="50.0" rx="6" class="f-soft"/><circle cx="188.0" cy="406.0" r="4.0" class="f-acc"/><circle cx="222.0" cy="406.0" r="4.0" class="f-acc"/><circle cx="188.0" cy="440.0" r="4.0" class="f-acc"/><circle cx="222.0" cy="440.0" r="4.0" class="f-acc"/><line x1="198.2" y1="412.3" x2="208.2" y2="422.3" class="warm"/><line x1="198.2" y1="422.3" x2="208.2" y2="412.3" class="warm"/><text x="176.0" y="421.3" class="t-s t-m t-warm" text-anchor="end">(4.45, 2.33)</text><path d="M756.0,428.0 C756.0,272.0 203.2,272.0 205.2,405.3" class="acc" marker-end="url(#fig-s3-ah-acc)"/><text x="479.6" y="286.0" class="t t-m" text-anchor="middle">① (x, y) = H<tspan dy="-6" class="t-sup">−1</tspan><tspan dy="6"> (x′, y′)</tspan></text><text x="336.0" y="344.0" class="t-b" text-anchor="start">For every output pixel (x′, y′):</text><text x="336.0" y="368.0" class="t-s" text-anchor="start">① map it back with the inverse matrix</text><text x="336.0" y="388.0" class="t-s" text-anchor="start">② interpolate f around the non-integer (x, y)</text><text x="336.0" y="408.0" class="t-s" text-anchor="start">   (bilinear uses the 4 shaded samples)</text><text x="336.0" y="428.0" class="t-s" text-anchor="start">③ write the result into g(x′, y′)</text><text x="336.0" y="462.0" class="t-s t-acc" text-anchor="start">Every output pixel gets exactly one value: no holes.</text><text x="336.0" y="482.0" class="t-s t-warm" text-anchor="start">Forward mapping (pushing source pixels) can leave</text><text x="336.0" y="498.0" class="t-s t-warm" text-anchor="start">holes and overlaps, because targets are rarely integers.</text><text x="756.0" y="466.0" class="t-s t-m t-acc" text-anchor="middle">③ g(x′, y′)</text></svg>