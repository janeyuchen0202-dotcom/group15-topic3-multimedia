svg.dia .dot-hollow { fill: #ffffff; stroke: #15202b; stroke-width: 1.4; }
svg.dia a.map-node { cursor: pointer; }
svg.dia a.map-node:hover .node, svg.dia a.map-node:focus .node { fill: #dcecf2; }</style><rect width="880" height="556" fill="#ffffff"/><title id="fig-s3-title">Transformation hierarchy and inverse mapping</title><desc id="fig-s3-desc">Top: a reference square under translation, rigid, similarity, affine and projective transforms, with degrees of freedom and the property each one keeps. Bottom: inverse mapping; an output pixel is mapped back into the source with the inverse matrix, the source is interpolated there, and the value is written to the output.</desc><defs><marker id="fig-s3-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="fig-s3-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="fig-s3-ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warm"/></marker></defs><rect x="12.0" y="14.0" width="136.0" height="196.0" rx="6" class="panel"/><polygon points="38.0,34.0 102.0,34.0 102.0,98.0 38.0,98.0" class="ln-mute dash"/><polygon points="38.0,34.0 102.0,34.0 102.0,98.0 38.0,98.0" class="f-soft"/><line x1="59.3" y1="34.0" x2="59.3" y2="98.0" class="acc-thin"/><line x1="38.0" y1="55.3" x2="102.0" y2="55.3" class="acc-thin"/><line x1="80.7" y1="34.0" x2="80.7" y2="98.0" class="acc-thin"/><line x1="38.0" y1="76.7" x2="102.0" y2="76.7" class="acc-thin"/><polygon points="38.0,34.0 102.0,34.0 102.0,98.0 38.0,98.0" class="acc"/><circle cx="38.0" cy="34.0" r="4.0" class="f-warm"/><text x="80.0" y="160.0" class="t-b" text-anchor="middle">Original</text><text x="80.0" y="196.0" class="t-s" text-anchor="middle">reference</text><rect x="156.0" y="14.0" width="136.0" height="196.0" rx="6" class="panel"/><polygon points="182.0,34.0 246.0,34.0 246.0,98