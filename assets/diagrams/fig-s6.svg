<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="400" class="dia" id="fig-s6" viewBox="0 0 880 400" role="img" aria-labelledby="fig-s6-title fig-s6-desc" xmlns="http://www.w3.org/2000/svg"><style>svg.dia { display: block; width: 100%; height: auto; font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
svg.dia text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
svg.dia .t { fill: #15202b; font-size: 13px; }
svg.dia .t-s { fill: #56636f; font-size: 11.5px; }
svg.dia .t-b { fill: #15202b; font-size: 13.5px; font-weight: 600; }
svg.dia .t-m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.dia .t-acc { fill: #0b6b88; }
svg.dia .t-warm { fill: #9c5700; }
svg.dia .t-inv { fill: #ffffff; }
svg.dia .t-num { fill: #ffffff; font-size: 13px; font-weight: 700; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.dia .t-badge { fill: #0b6b88; font-size: 11.5px; font-weight: 700; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg.dia .t-sup { font-size: 10px; }
svg.dia .ln { stroke: #15202b; stroke-width: 1.4; fill: none; }
svg.dia .ln-mute { stroke: #56636f; stroke-width: 1; fill: none; }
svg.dia .ln-thick { stroke: #15202b; stroke-width: 5; fill: none; stroke-linecap: round; }
svg.dia .grid { stroke: #d4dbe2; stroke-width: 1; fill: none; }
svg.dia .dash { stroke-dasharray: 4 4; }
svg.dia .acc { stroke: #0b6b88; stroke-width: 2.2; fill: none; }
svg.dia .acc-thin { stroke: #0b6b88; stroke-width: 0.8; opacity: 0.55; fill: none; }
svg.dia .warm { stroke: #9c5700; stroke-width: 2; fill: none; }
svg.dia .f-ink { fill: #15202b; }
svg.dia .f-acc { fill: #0b6b88; }
svg.dia .f-warm { fill: #9c5700; }
svg.dia .f-soft { fill: #dcecf2; }
svg.dia .f-warmsoft { fill: #f8ead6; }
svg.dia .f-mute { fill: #56636f; }
svg.dia .f-surf { fill: #ffffff; }
svg.dia .box { fill: #ffffff; stroke: #d4dbe2; stroke-width: 1.2; }
svg.dia .node { stroke: #0b6b88; stroke-width: 1.4; }
svg.dia .panel { fill: #f3f5f7; stroke: #d4dbe2; stroke-width: 1; }
svg.dia .frame { fill: none; stroke: #d4dbe2; stroke-width: 1; }
svg.dia .lane { fill: #f3f5f7; stroke: #d4dbe2; stroke-width: 1; }
svg.dia .fuse { fill: #dcecf2; stroke: #0b6b88; stroke-width: 1.4; stroke-dasharray: 6 4; }
svg.dia .badge { fill: #ffffff; stroke: #0b6b88; stroke-width: 1.4; }
svg.dia .ring-acc { fill: none; stroke: #0b6b88; stroke-width: 2; }
svg.dia .dot-hollow { fill: #ffffff; stroke: #15202b; stroke-width: 1.4; }
svg.dia a.map-node { cursor: pointer; }
svg.dia a.map-node:hover .node, svg.dia a.map-node:focus .node { fill: #dcecf2; }</style><rect width="880" height="400" fill="#ffffff"/><title id="fig-s6-title">A video processing pipeline that keeps frames on the GPU</title><desc id="fig-s6-desc">The CPU reads compressed video and writes compressed output. Decoding, colour conversion, resizing, warping, filtering and encoding run on the GPU, with the middle stages fused so each pixel is read and written once. Copies of raw frames across PCIe, about 56 times slower than GPU memory in NVIDIA&#x27;s V100 example, are avoided.</desc><defs><marker id="fig-s6-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker><marker id="fig-s6-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="fig-s6-ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warm"/></marker></defs><rect x="14.0" y="14.0" width="852.0" height="86.0" rx="8" class="lane"/><text x="28.0" y="36.0" class="t-b" text-anchor="start">CPU + system memory</text><rect x="14.0" y="172.0" width="852.0" height="160.0" rx="8" class="lane"/><text x="28.0" y="194.0" class="t-b" text-anchor="start">GPU + device memory  (≈ 898 GB/s on a V100)</text><rect x="40.0" y="48.0" width="150.0" height="38.0" rx="6" class="box"/><text x="115.0" y="72.0" class="t-s" text-anchor="middle">read file / network</text><rect x="355.0" y="48.0" width="170.0" height="38.0" rx="6" class="box"/><text x="440.0" y="72.0" class="t-s" text-anchor="middle">control and scheduling</text><rect x="690.0" y="48.0" width="150.0" height="38.0" rx="6" class="box"/><text x="765.0" y="72.0" class="t-s" text-anchor="middle">write / stream out</text><text x="330.0" y="130.0" class="t t-m" text-anchor="middle">PCIe ×16 Gen3 ≈ 16 GB/s</text><text x="330.0" y="148.0" class="t-s" text-anchor="middle">send only compressed bitstreams across</text><rect x="30.0" y="228.0" width="104.0" height="50.0" rx="6" class="box"/><text x="82.0" y="249.0" class="t" text-anchor="middle">decode</text><text x="82.0" y="267.0" class="t-s t-m" text-anchor="middle">NVDEC</text><rect x="166.0" y="214.0" width="372.0" height="78.0" rx="8" class="fuse"/><text x="352.0" y="310.0" class="t-s t-acc" text-anchor="middle">fused: one read and one write per pixel</text><rect x="180.0" y="228.0" width="104.0" height="50.0" rx="6" class="box"/><text x="232.0" y="249.0" class="t" text-anchor="middle">colour convert</text><text x="232.0" y="267.0" class="t-s t-m t-acc" text-anchor="middle">§5</text><line x1="284.0" y1="253.0" x2="298.0" y2="253.0" class="ln" marker-end="url(#fig-s6-ah)"/><rect x="300.0" y="228.0" width="104.0" height="50.0" rx="6" class="box"/><text x="352.0" y="249.0" class="t" text-anchor="middle">resize</text><text x="352.0" y="267.0" class="t-s t-m t-acc" text-anchor="middle">§2</text><line x1="404.0" y1="253.0" x2="418.0" y2="253.0" class="ln" marker-end="url(#fig-s6-ah)"/><rect x="420.0" y="228.0" width="104.0" height="50.0" rx="6" class="box"/><text x="472.0" y="249.0" class="t" text-anchor="middle">warp</text><text x="472.0" y="267.0" class="t-s t-m t-acc" text-anchor="middle">§3</text><line x1="134.0" y1="253.0" x2="178.0" y2="253.0" class="ln" marker-end="url(#fig-s6-ah)"/><rect x="570.0" y="228.0" width="120.0" height="50.0" rx="6" class="box"/><text x="630.0" y="249.0" class="t" text-anchor="middle">filter / FFT</text><text x="630.0" y="267.0" class="t-s t-m t-acc" text-anchor="middle">§4</text><line x1="524.0" y1="253.0" x2="568.0" y2="253.0" class="ln" marker-end="url(#fig-s6-ah)"/><rect x="722.0" y="228.0" width="118.0" height="50.0" rx="6" class="box"/><text x="781.0" y="249.0" class="t" text-anchor="middle">encode</text><text x="781.0" y="267.0" class="t-s t-m" text-anchor="middle">NVENC</text><line x1="690.0" y1="253.0" x2="720.0" y2="253.0" class="ln" marker-end="url(#fig-s6-ah)"/><line x1="100.0" y1="86.0" x2="82.0" y2="226.0" class="acc" marker-end="url(#fig-s6-ah-acc)"/><text x="104.0" y="140.0" class="t-s" text-anchor="start">bitstream in</text><line x1="781.0" y1="228.0" x2="772.0" y2="88.0" class="acc" marker-end="url(#fig-s6-ah-acc)"/><text x="786.0" y="140.0" class="t-s" text-anchor="start">bitstream out</text><line x1="560.0" y1="104.0" x2="560.0" y2="168.0" class="warm dash" marker-start="url(#fig-s6-ah-warm)" marker-end="url(#fig-s6-ah-warm)"/><line x1="552.0" y1="128.0" x2="568.0" y2="144.0" class="warm"/><line x1="552.0" y1="144.0" x2="568.0" y2="128.0" class="warm"/><text x="576.0" y="132.0" class="t-s t-warm" text-anchor="start">raw frames: avoid</text><text x="576.0" y="148.0" class="t-s t-warm" text-anchor="start">round trips (≈ 56× slower)</text><text x="20.0" y="362.0" class="t-s" text-anchor="start">Cost ≈ pixels × operations per pixel + bytes moved.  Halving width and height leaves ¼ of the pixels.</text><text x="20.0" y="382.0" class="t-s" text-anchor="start">Bandwidths from NVIDIA's CUDA C++ Best Practices Guide §10.1 (V100 example). §n = section of this hub.</text></svg>